<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Private</title>
<style>
  :root { --bg:#040605; --ink:#eaf3e7; --muted:#a3b79f; --slime:#74e05c; --line:rgba(140,220,120,.3); }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:20px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; display:grid; place-items:center; padding:16px; box-sizing:border-box; }
  form { width:min(460px,100%); background:rgba(6,12,8,.9); border:1px solid var(--line); border-radius:16px; padding:28px; display:flex; flex-direction:column; gap:16px; }
  h1 { margin:0; font-size:34px; color:var(--slime); }
  p { margin:0; color:var(--muted); }
  label { font-weight:700; }
  input[type=password] { font:inherit; font-size:24px; padding:14px; border-radius:10px; border:1px solid var(--line); background:#0d160d; color:var(--ink); }
  .row { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:18px; }
  .row input { width:22px; height:22px; }
  button { font:inherit; font-size:24px; font-weight:800; padding:16px; border-radius:12px; border:1px solid #8af06f; background:linear-gradient(#3c8f2c,#24601a); color:var(--ink); cursor:pointer; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--slime); outline-offset:2px; }
  #msg { min-height:1.4em; color:#ff8a7a; font-weight:700; }
</style>
</head>
<body>
<form id="f">
  <h1>Private test</h1>
  <p>Only for people with the password.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <div class="row"><input id="keep" type="checkbox" checked><label for="keep" style="font-weight:400">Remember on this device</label></div>
  <button type="submit">Open</button>
  <div id="msg" role="alert"></div>
</form>

async function open_(pw) {
  const raw = Uint8Array.from(atob(BLOB), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(plain);
}
async function go(pw, remember) {
  const msg = document.getElementById('msg'); msg.textContent = 'Opening…';
  try {
    const page = await open_(pw);
    try { if (remember) localStorage.setItem('k', pw); } catch (e) {}
    document.open(); document.write(page); document.close();
  } catch (e) { msg.textContent = 'That password is not correct.'; try { localStorage.removeItem('k'); } catch (x) {} }
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); go(document.getElementById('pw').value.trim(), document.getElementById('keep').checked); });
try { const k = localStorage.getItem('k'); if (k) go(k, true); } catch (e) {}
